version: "2.0.0"
namespace: mirror
scripts:
  directory: .scripts
commands:
  - uid: mirror-fmt
    id: fmt
    summary: Check Go formatting.
    description: List first-party Go files that require gofmt.
    command: gofmt -l .
    confirm: never

  - uid: mirror-test
    id: test
    summary: Run all Go tests.
    description: Run every package test once without cached results.
    command: go test -count=1 ./...
    confirm: never

  - uid: mirror-vet
    id: vet
    summary: Vet all Go packages.
    description: Run standard Go static analysis over every package.
    command: go vet ./...
    confirm: never

  - uid: mirror-build
    id: build
    summary: Build the release matrix.
    description: Build the exact 11-asset release matrix with local development metadata.
    command: go run ./devops/build-binaries.go --version 0.0.0-dev --commit local --build-date 2026-01-01T00:00:00Z
    confirm: never

  - uid: mirror-verify-assets
    id: verify-assets
    summary: Verify release assets.
    description: Verify names, count, metadata, and checksums for the generated release set.
    command: go run ./devops/verify-release-assets --directory bin
    confirm: never

  - uid: mirror-help-tree
    id: help-tree
    summary: Show the command hierarchy.
    description: Render the complete live Cobra command and flag tree.
    command: go run . --help-tree
    confirm: never

  - uid: mirror-test-stable-upgrade
    id: test-stable-upgrade
    summary: Prove native stable upgrades.
    description: Prove the native v4.2.4 bridge and synchronous stable-launcher older-to-newer activation.
    command: go test -count=1 ./pkg/launcher ./pkg/updater -run 'TestLegacyDecoratedVersionProbeDetectsV424Helper|TestNativeStableLauncherUpgradeIsSynchronous'
    confirm: never

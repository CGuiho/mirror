name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'mirror/v*'

jobs:
  go-quality-and-release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify tidy module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test all Go packages
        run: go test -count=1 ./...

      - name: Vet all Go packages
        run: go vet ./...

      - name: Build exact 11-asset release matrix
        run: |
          build_date="$(git show -s --format=%cI HEAD)"
          go run ./devops/build-binaries.go \
            --version 0.0.0-ci \
            --commit "${GITHUB_SHA}" \
            --build-date "${build_date}"
          go run ./devops/verify-release-assets --directory bin

      - name: Smoke native Linux binary
        env:
          MIRROR_DISABLE_UPDATE_CHECK: '1'
        run: |
          bootstrap_root="$(mktemp -d)"
          trap 'rm -rf "$bootstrap_root"' EXIT
          mkdir -p "$bootstrap_root/home" "$bootstrap_root/project"
          test "$(bin/mirror-linux-amd64 --version)" = 'mirror v0.0.0-ci'
          test "$(MIRROR_HOME_DIR="$bootstrap_root/home" bin/mirror-linux-amd64 --cwd "$bootstrap_root/project")" = 'Hello Windows - mirror v0.0.0-ci'
          test -s "$bootstrap_root/home/.agents/skills/guiho-s-mirror/SKILL.md"
          test -s "$bootstrap_root/home/.claude/skills/guiho-s-mirror/SKILL.md"
          test "$(grep -Fc '<!-- BEGIN MIRROR — DO NOT EDIT THIS SECTION -->' "$bootstrap_root/project/AGENTS.md")" -eq 1
          test "$(sed -n '/<!-- BEGIN MIRROR/{n;p;q;}' "$bootstrap_root/project/AGENTS.md")" = '## GUIHO Mirror Instruction Block'
          ! sed -n '/<!-- BEGIN MIRROR/,/<!-- END MIRROR -->/p' "$bootstrap_root/project/AGENTS.md" | grep -F 'name: guiho-i-mirror'
          test -n "$(awk '/<!-- END MIRROR -->/{print previous; exit}{previous=$0}' "$bootstrap_root/project/AGENTS.md")"
          bin/mirror-linux-amd64 --help-tree-depth 2 --help-tree | grep -F 'COMMAND TREE'
          bin/mirror-linux-amd64 agent skill show guiho-s-mirror | grep -F 'name: guiho-s-mirror'
          bin/mirror-linux-amd64 config check

      - name: Validate Bash installer and target mapping
        shell: bash
        run: |
          sh -n devops/install.sh
          dash -n devops/install.sh
          bash -n devops/install.sh
          export MIRROR_INSTALLER_SOURCE_ONLY=1
          source devops/install.sh
          MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=x86_64 test "$(MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=x86_64 detect_asset)" = mirror-linux-amd64
          MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=aarch64 test "$(MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=aarch64 detect_asset)" = mirror-linux-arm64
          MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=armv7l test "$(MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=armv7l detect_asset)" = mirror-linux-armv7
          MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=armv6l test "$(MIRROR_TEST_OS=linux MIRROR_TEST_ARCH=armv6l detect_asset)" = mirror-linux-armv6
          MIRROR_TEST_OS=darwin MIRROR_TEST_ARCH=x86_64 test "$(MIRROR_TEST_OS=darwin MIRROR_TEST_ARCH=x86_64 detect_asset)" = mirror-darwin-amd64
          MIRROR_TEST_OS=darwin MIRROR_TEST_ARCH=arm64 test "$(MIRROR_TEST_OS=darwin MIRROR_TEST_ARCH=arm64 detect_asset)" = mirror-darwin-arm64

      - name: Exercise Bash installer offline
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/home" "$root/project" "$root/install"
          cd "$root/project"
          for attempt in 1 2; do
            cat "$GITHUB_WORKSPACE/devops/install.sh" | \
              MIRROR_HOME_DIR="$root/home" \
              MIRROR_ASSET_DIR="$GITHUB_WORKSPACE/bin" \
              MIRROR_INSTALL_DIR="$root/install" \
              MIRROR_SKIP_PATH_UPDATE=1 \
              MIRROR_DISABLE_UPDATE_CHECK=1 \
              sh -s -- --version 0.0.0-ci
          done
          test "$(MIRROR_DISABLE_UPDATE_CHECK=1 "$root/install/mirror" --version)" = 'mirror v0.0.0-ci'
          test -s "$root/home/.agents/skills/guiho-s-mirror/SKILL.md"
          test -s "$root/home/.claude/skills/guiho-s-mirror/SKILL.md"
          test "$(grep -Fc '<!-- BEGIN MIRROR — DO NOT EDIT THIS SECTION -->' AGENTS.md)" -eq 1
          test "$(sed -n '/<!-- BEGIN MIRROR/{n;p;q;}' AGENTS.md)" = '## GUIHO Mirror Instruction Block'
          ! sed -n '/<!-- BEGIN MIRROR/,/<!-- END MIRROR -->/p' AGENTS.md | grep -F 'name: guiho-i-mirror'
          test -n "$(awk '/<!-- END MIRROR -->/{print previous; exit}{previous=$0}' AGENTS.md)"

      - uses: actions/upload-artifact@v4
        with:
          name: mirror-go-release-assets
          path: bin/*
          if-no-files-found: error

  native-smoke:
    needs: go-quality-and-release-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: mirror-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: mirror-linux-arm64
          - runner: macos-15-intel
            asset: mirror-darwin-amd64
          - runner: macos-15
            asset: mirror-darwin-arm64
          - runner: windows-latest
            asset: mirror-windows-amd64.exe
          - runner: windows-11-arm
            asset: mirror-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mirror-go-release-assets
          path: bin

      - name: Smoke Unix target
        if: runner.os != 'Windows'
        env:
          MIRROR_DISABLE_UPDATE_CHECK: '1'
        run: |
          bootstrap_root="$(mktemp -d)"
          trap 'rm -rf "$bootstrap_root"' EXIT
          mkdir -p "$bootstrap_root/home" "$bootstrap_root/project"
          chmod +x "bin/${{ matrix.asset }}"
          test "$("bin/${{ matrix.asset }}" --version)" = 'mirror v0.0.0-ci'
          test "$(MIRROR_HOME_DIR="$bootstrap_root/home" "bin/${{ matrix.asset }}" --cwd "$bootstrap_root/project")" = 'Hello Windows - mirror v0.0.0-ci'
          "bin/${{ matrix.asset }}" agent prompt list --names | grep -Fx guiho-i-mirror

      - name: Smoke Windows target
        if: runner.os == 'Windows'
        shell: powershell
        env:
          MIRROR_DISABLE_UPDATE_CHECK: '1'
        run: |
          $binary = Join-Path $PWD 'bin\${{ matrix.asset }}'
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP 'mirror-native-bootstrap'
          $env:MIRROR_HOME_DIR = Join-Path $bootstrapRoot 'home'
          $project = Join-Path $bootstrapRoot 'project'
          New-Item -ItemType Directory -Force -Path $env:MIRROR_HOME_DIR, $project | Out-Null
          if ((& $binary --version | Out-String).Trim() -ne 'mirror v0.0.0-ci') { exit 1 }
          if ((& $binary --cwd $project | Out-String).Trim() -ne 'Hello Windows - mirror v0.0.0-ci') { exit 1 }
          if ((& $binary agent prompt list --names | Out-String).Trim() -ne 'guiho-i-mirror') { exit 1 }

  windows-installer:
    needs: go-quality-and-release-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mirror-go-release-assets
          path: bin

      - name: Validate PowerShell installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'devops\install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Exercise PowerShell installer offline
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mirror-installer'
          $mirrorHome = Join-Path $root 'home'
          $project = Join-Path $root 'project'
          $install = Join-Path $root 'install'
          $invalidInstall = Join-Path $root 'invalid-install'
          New-Item -ItemType Directory -Force -Path $mirrorHome, $project | Out-Null
          $env:MIRROR_HOME_DIR = $mirrorHome
          $env:MIRROR_ASSET_DIR = (Resolve-Path 'bin').Path
          $env:MIRROR_SKIP_PATH_UPDATE = '1'
          $env:MIRROR_DISABLE_UPDATE_CHECK = '1'
          $env:MIRROR_VERSION = '0.0.0-ci'
          $installerSource = Get-Content -Raw -LiteralPath "$env:GITHUB_WORKSPACE\devops\install.ps1"
          $hadProcessorArchitecture = Test-Path Env:PROCESSOR_ARCHITECTURE
          $previousProcessorArchitecture = $env:PROCESSOR_ARCHITECTURE
          $hadProcessorArchitectureWow64 = Test-Path Env:PROCESSOR_ARCHITEW6432
          $previousProcessorArchitectureWow64 = $env:PROCESSOR_ARCHITEW6432
          Push-Location $project
          try {
            $env:MIRROR_INSTALLER_SOURCE_ONLY = '1'
            $env:MIRROR_TEST_ARCH = ' '
            $env:MIRROR_TEST_RUNTIME_ARCH = ' '
            $env:PROCESSOR_ARCHITEW6432 = ' '
            $env:PROCESSOR_ARCHITECTURE = 'AMD64'
            $installerSource | Invoke-Expression
            if ((Get-MirrorAssetName) -ne 'mirror-windows-amd64.exe') { throw 'Processor architecture fallback failed.' }
            $env:PROCESSOR_ARCHITECTURE = 'ARM64'
            if ((Get-MirrorAssetName) -ne 'mirror-windows-arm64.exe') { throw 'ARM64 processor architecture fallback failed.' }
            Remove-Item Env:MIRROR_INSTALLER_SOURCE_ONLY
            Remove-Item Env:MIRROR_TEST_RUNTIME_ARCH
            Remove-Item Env:MIRROR_TEST_ARCH
            if ($hadProcessorArchitecture) { $env:PROCESSOR_ARCHITECTURE = $previousProcessorArchitecture } else { Remove-Item Env:PROCESSOR_ARCHITECTURE }
            if ($hadProcessorArchitectureWow64) { $env:PROCESSOR_ARCHITEW6432 = $previousProcessorArchitectureWow64 } else { Remove-Item Env:PROCESSOR_ARCHITEW6432 }

            $env:MIRROR_INSTALL_DIR = $invalidInstall
            $env:MIRROR_TEST_ARCH = 'unsupported'
            $failedAsExpected = $false
            try {
              $installerSource | Invoke-Expression
            } catch {
              if ($_.Exception.Message -ne 'Mirror installer failed during architecture detection: Unsupported Mirror installer architecture: unsupported') { throw }
              $failedAsExpected = $true
            }
            if (-not $failedAsExpected) { throw 'Installer unexpectedly accepted an unsupported architecture.' }
            if (Test-Path -LiteralPath $invalidInstall) { throw 'Failed pre-install validation created the install directory.' }
            Remove-Item Env:MIRROR_TEST_ARCH

            $env:MIRROR_INSTALL_DIR = $install
            $installerSource | Invoke-Expression
            $installerSource | Invoke-Expression

            if ((& "$install\mirror.exe" --version | Out-String).Trim() -ne 'mirror v0.0.0-ci') { exit 1 }
            if (-not (Test-Path "$mirrorHome\.agents\skills\guiho-s-mirror\SKILL.md")) { exit 1 }
            if (-not (Test-Path "$mirrorHome\.claude\skills\guiho-s-mirror\SKILL.md")) { exit 1 }
            if ((Select-String -LiteralPath "$project\AGENTS.md" -SimpleMatch '<!-- BEGIN MIRROR').Count -ne 1) { exit 1 }
            $agentsContent = ([System.IO.File]::ReadAllText("$project\AGENTS.md") -replace "`r`n", "`n")
            $managedStart = "<!-- BEGIN MIRROR $([char]0x2014) DO NOT EDIT THIS SECTION -->`n## GUIHO Mirror Instruction Block`n"
            if (-not $agentsContent.Contains($managedStart)) { throw 'Managed instruction body did not begin after the marker.' }
            $managed = $agentsContent.Substring($agentsContent.IndexOf('<!-- BEGIN MIRROR'), $agentsContent.IndexOf('<!-- END MIRROR -->') - $agentsContent.IndexOf('<!-- BEGIN MIRROR'))
            if ($managed.Contains('name: guiho-i-mirror') -or $managed.Contains("`n---`n")) { throw 'Managed instruction contains release frontmatter.' }
            if ($agentsContent.Contains("`n`n<!-- END MIRROR -->")) { throw 'Managed instruction has a blank line before the end marker.' }
          } finally {
            Pop-Location
            foreach ($name in @('MIRROR_HOME_DIR', 'MIRROR_ASSET_DIR', 'MIRROR_INSTALL_DIR', 'MIRROR_SKIP_PATH_UPDATE', 'MIRROR_DISABLE_UPDATE_CHECK', 'MIRROR_VERSION', 'MIRROR_TEST_ARCH', 'MIRROR_TEST_RUNTIME_ARCH', 'MIRROR_INSTALLER_SOURCE_ONLY')) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
            if ($hadProcessorArchitecture) { $env:PROCESSOR_ARCHITECTURE = $previousProcessorArchitecture } else { Remove-Item Env:PROCESSOR_ARCHITECTURE -ErrorAction SilentlyContinue }
            if ($hadProcessorArchitectureWow64) { $env:PROCESSOR_ARCHITEW6432 = $previousProcessorArchitectureWow64 } else { Remove-Item Env:PROCESSOR_ARCHITEW6432 -ErrorAction SilentlyContinue }
          }

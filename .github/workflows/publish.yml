name: Publish Go Release

on:
  push:
    tags:
      - 'mirror/v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve canonical release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != mirror/v* ]]; then
            echo "Non-canonical Mirror Go tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#mirror/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Mirror semantic version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -count=1 ./...
          go vet ./...

      - name: Build and verify exact 11 assets
        run: |
          go run ./devops/build-binaries.go \
            --version '${{ steps.release.outputs.version }}' \
            --commit "${GITHUB_SHA}" \
            --build-date '${{ steps.release.outputs.build_date }}'
          go run ./devops/verify-release-assets --directory bin
          test "$(MIRROR_DISABLE_UPDATE_CHECK=1 bin/mirror-linux-amd64 --version)" = 'mirror v${{ steps.release.outputs.version }}'

      - name: Extract exact-version release notes
        run: go run ./devops/extract-release-notes "${GITHUB_REF_NAME}" CHANGELOG.md "${RUNNER_TEMP}/mirror-release-notes.md"

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find bin -maxdepth 1 -type f -printf '%f\n' | sort)
          asset_paths=()
          for asset in "${assets[@]}"; do asset_paths+=("bin/$asset"); done
          release_flags=()
          if [[ '${{ steps.release.outputs.version }}' == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            while IFS= read -r current; do
              if [[ ! -f "bin/$current" ]]; then
                gh release delete-asset "${GITHUB_REF_NAME}" "$current" --yes
              fi
            done < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
            gh release upload "${GITHUB_REF_NAME}" "${asset_paths[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/mirror-release-notes.md" "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" "${asset_paths[@]}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/mirror-release-notes.md" "${release_flags[@]}"
          fi

      - name: Verify exact public asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find bin -maxdepth 1 -type f -printf '%f\n' | sort > "${RUNNER_TEMP}/expected-assets.txt"
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort > "${RUNNER_TEMP}/actual-assets.txt"
          test "$(wc -l < "${RUNNER_TEMP}/actual-assets.txt" | tr -d '[:space:]')" -eq 11
          cmp "${RUNNER_TEMP}/expected-assets.txt" "${RUNNER_TEMP}/actual-assets.txt"

      - name: Verify tag-pinned public installer
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/home" "$root/project" "$root/install"
          cd "$root/project"
          MIRROR_HOME_DIR="$root/home" \
          MIRROR_INSTALL_DIR="$root/install" \
          MIRROR_SKIP_PATH_UPDATE=1 \
          MIRROR_DISABLE_UPDATE_CHECK=1 \
            bash "$GITHUB_WORKSPACE/devops/install.sh" --version '${{ steps.release.outputs.version }}'
          test "$(MIRROR_DISABLE_UPDATE_CHECK=1 "$root/install/mirror" --version)" = 'mirror v${{ steps.release.outputs.version }}'
